name: Gmail autosync

# Pings /gmail/sync on the deployed Render service every 10 minutes so new
# email confirmations / interview invites / rejections flow into the tracker
# without needing the user to click "Sync Now" manually.
#
# Credentials live in GitHub repo secrets, NOT in this file:
#   - ADMIN_USERNAME — HTTP basic auth username (e.g. "ajinkya")
#   - ADMIN_PASSWORD — HTTP basic auth password
#
# To add them: GitHub repo → Settings → Secrets and variables → Actions → New
# repository secret. Add both names with the values you set in Render.

on:
  schedule:
    # GitHub cron is UTC. "*/10 * * * *" = every 10 minutes.
    # Note: GitHub may queue or skip cron runs under heavy load; treat 10 min
    # as an upper bound rather than a guarantee.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}  # also allows manual triggering from Actions tab

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Gmail sync on Render
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -e
          response=$(curl -X POST \
            -u "$ADMIN_USERNAME:$ADMIN_PASSWORD" \
            -H "Content-Type: application/json" \
            --max-time 240 \
            -s \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            https://job-tracker-bmhy.onrender.com/gmail/sync)
          echo "$response"
          # Parse out the HTTP status for fail/pass signaling
          status=$(echo "$response" | grep "^HTTP_STATUS:" | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "::error::Sync returned HTTP $status"
            exit 1
          fi
          # Surface a compact summary in the Actions log
          body=$(echo "$response" | sed '/^HTTP_STATUS:/d')
          echo "::notice::Sync result: $(echo "$body" | python3 -c "
          import sys, json
          d = json.loads(sys.stdin.read())
          print(f\"mode={d.get('mode','?')} fetched={d.get('fetched',0)} logged={d.get('logged',0)} status_changes={len(d.get('status_changes',[]))}\")")"
