<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Tracker Capture</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: #0b0b0e;
    color: #f4f3ef;
    width: 320px;
    margin: 0;
    padding: 16px;
    box-sizing: border-box;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .logo {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: #7e44ff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 12px;
    font-weight: bold;
  }
  h1 {
    font-size: 14px;
    margin: 0;
    font-weight: 600;
  }
  .page-title {
    font-size: 12px;
    color: #a7a6a1;
    margin-bottom: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  button {
    width: 100%;
    padding: 10px 14px;
    background: #7e44ff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: #9a6bff; }
  button:disabled {
    background: #2a2a32;
    color: #6c6c72;
    cursor: not-allowed;
  }
  .status {
    margin-top: 10px;
    font-size: 12px;
    color: #a7a6a1;
    min-height: 18px;
    line-height: 1.4;
  }
  .status.ok { color: #22c55e; }
  .status.err { color: #ef4444; }
  .status.info { color: #4b8df8; }
  .settings {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid #26262e;
  }
  .settings.collapsed .settings-body { display: none; }
  .settings-toggle {
    background: none;
    border: none;
    color: #6c6c72;
    font-size: 11px;
    padding: 0;
    cursor: pointer;
    text-align: left;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .settings-toggle:hover { color: #a7a6a1; background: transparent; }
  label {
    font-size: 10px;
    color: #6c6c72;
    display: block;
    margin: 6px 0 3px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  input {
    width: 100%;
    padding: 7px 9px;
    background: #131318;
    color: #f4f3ef;
    border: 1px solid #26262e;
    border-radius: 6px;
    font-size: 12px;
    box-sizing: border-box;
    font-family: 'JetBrains Mono', monospace;
  }
  input:focus { outline: none; border-color: #7e44ff; }
  .save-btn {
    margin-top: 8px;
    background: #26262e;
    font-size: 11px;
    padding: 6px 12px;
    width: auto;
  }
  .save-btn:hover:not(:disabled) { background: #32323c; }
  .view-link {
    margin-top: 10px;
    font-size: 11px;
    color: #4b8df8;
    text-decoration: none;
    display: none;
  }
  .view-link.show { display: inline-block; }
  .view-link:hover { color: #6ba0ff; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">✓</div>
  <h1>Job Tracker</h1>
</div>

<div class="page-title" id="page-title">Loading page info...</div>

<button id="capture-btn">Capture this page</button>
<div class="status" id="status"></div>
<a href="#" id="view-link" class="view-link" target="_blank">Open in Job Tracker ↗</a>

<div class="settings collapsed" id="settings">
  <button class="settings-toggle" id="settings-toggle">⚙ Settings</button>
  <div class="settings-body">
    <label for="api-url">API endpoint</label>
    <input id="api-url" type="text" placeholder="http://localhost:8001">
    <label for="api-token">API token</label>
    <input id="api-token" type="text" placeholder="Paste your token">
    <button class="save-btn" id="save-btn">Save settings</button>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
