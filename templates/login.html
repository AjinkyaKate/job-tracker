<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · Job Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%8B</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
        colors: {
          base:   { light: '#fafaf9', DEFAULT: '#0b0b0e' },
          raised: { light: '#ffffff', DEFAULT: '#131318' },
          line:   { light: '#e6e4e0', DEFAULT: '#26262e' },
          line2:  { light: '#d8d6d1', DEFAULT: '#32323c' },
          ink:    { light: '#0f0f12', DEFAULT: '#f4f3ef' },
          ink2:   { light: '#55554f', DEFAULT: '#a7a6a1' },
          ink3:   { light: '#85847d', DEFAULT: '#6c6c72' },
          accent: { 400:'#9a6bff', 500:'#7e44ff', 600:'#6a2ef0' },
        },
      }
    }
  };
</script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .glow {
    background: radial-gradient(circle at 50% 0%, rgba(126, 68, 255, 0.15), transparent 60%);
  }
</style>
</head>
<body class="bg-base text-ink antialiased min-h-screen flex flex-col">

<!-- Subtle glow background -->
<div class="glow absolute inset-0 pointer-events-none"></div>

<!-- Main content centered -->
<main class="flex-1 flex items-center justify-center px-4 py-12 relative z-10">
  <div class="w-full max-w-sm">

    <!-- Logo + Brand -->
    <div class="flex items-center justify-center gap-3 mb-12">
      <div class="w-9 h-9 rounded-lg bg-accent-500 flex items-center justify-center shadow-lg shadow-accent-500/30">
        <svg viewBox="0 0 20 20" class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M4 11l4 4 8-9"/>
        </svg>
      </div>
      <div class="text-[18px] font-semibold tracking-tight">Job Tracker</div>
    </div>

    <!-- Card -->
    <div class="bg-raised border border-line rounded-2xl p-8 shadow-2xl shadow-black/30">

      <h1 class="text-[22px] font-semibold mb-1 text-center">Sign in</h1>
      <p class="text-ink3 text-[13px] text-center mb-8">
        Continue with your Google account
      </p>

      <a href="/auth/gmail/start"
         class="flex items-center justify-center gap-3 w-full h-12 rounded-lg bg-white text-gray-900 font-medium text-[14px] hover:bg-gray-100 transition shadow-md">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Continue with Google</span>
      </a>

    </div>

    <!-- Privacy note -->
    <p class="mt-8 text-center text-ink3 text-[11px] leading-relaxed">
      By continuing, you grant read access to your Gmail so we can sync your job-related emails.<br>
      Your data stays yours.
    </p>

  </div>
</main>

</body>
</html>
