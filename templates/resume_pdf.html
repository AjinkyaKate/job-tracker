<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ pdf_filename }}</title>
<style>
  /* Clean print-only stylesheet. No Tailwind, no dark mode, no toolbar.
     Playwright renders this exactly; margins come from page.pdf() so we
     keep body padding at 0. Links stay as real <a href> so Chromium's
     printToPDF embeds clickable annotations. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #16161a;
    font-size: 13px;
    line-height: 1.42;
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-size: 23px; font-weight: 700; letter-spacing: -0.02em;
    margin-bottom: 2px; color: #0f0f12;
  }
  /* The contact line (first paragraph after the name) */
  h1 + p { font-size: 11.5px; color: #555; margin-bottom: 13px; line-height: 1.4; }

  h2 {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.09em; color: #6a2ef0;
    margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1px solid #e0e0e0;
  }
  h3 { font-size: 13.5px; font-weight: 700; margin: 9px 0 1px; color: #0f0f12; }
  h3 + p { font-size: 11.5px; color: #555; font-style: italic; margin-bottom: 5px; line-height: 1.35; }

  p { margin-bottom: 4px; font-size: 12.5px; }
  ul { margin: 2px 0 8px; padding-left: 17px; list-style: disc; }
  li { margin-bottom: 2.5px; font-size: 12.5px; line-height: 1.4; }
  strong { font-weight: 700; color: #16161a; }
  a { color: #6a2ef0; text-decoration: none; }

  /* Keep headings with the content that follows them when a page breaks. */
  h2, h3 { break-after: avoid; page-break-after: avoid; }
  li, p { break-inside: avoid; page-break-inside: avoid; }
</style>
</head>
<body>
  {{ resume_html | safe }}
</body>
</html>
