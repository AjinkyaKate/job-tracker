# Fly.io app config for Job Tracker
# Single-machine + persistent volume for SQLite. Always-on (no auto-stop) so
# the URL is reachable 24/7 without cold starts.
#
# Edit `app` below to a globally-unique name BEFORE running `flyctl deploy`.

app = "job-tracker-ajinkya"
primary_region = "bom"  # Mumbai. Closest low-latency region for India users.

[build]
  # Uses the Dockerfile in repo root. No buildpacks.

[env]
  # Fly's load balancer expects the app on this port. Dockerfile binds uvicorn here.
  PORT = "8080"
  # SQLite lives on the mounted volume so it survives restarts and redeploys.
  DB_FILE = "/data/tracker.db"

[http_service]
  internal_port = 8080
  force_https = true
  # 24/7 uptime: never auto-stop the machine when idle.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

# Persistent disk for tracker.db. 1 GB is well below Fly's 3 GB free allowance.
[[mounts]]
  source = "tracker_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
